<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memos - WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="memos-styles.css">
</head>
<body data-page="communications">
    <!-- Navigation loaded from nav.html -->
    <div id="nav-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Memos</h1>
                <p>Access official memos and internal communications</p>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-container">
                <div class="search-bar">
                    <i class="fas fa-search search-icon"></i>
                    <input
                        type="text"
                        id="memoSearch"
                        class="search-input-memo"
                        placeholder="Search memos by title or subject..."
                    >
                    <button id="clearSearch" class="clear-search-btn" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="searchResults" class="search-results-info"></div>
            </div>

            <!-- Filter Options -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="yearFilter">Year:</label>
                    <select id="yearFilter" class="filter-select">
                        <option value="all">All Years</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">All Categories</option>
                        <option value="policy">Policy</option>
                        <option value="operational">Operational</option>
                        <option value="administrative">Administrative</option>
                        <option value="hr">Human Resources</option>
                    </select>
                </div>
            </div>

            <!-- Memos List -->
            <div class="memos-grid" id="memos-list">
                <p class="loading-message">Loading memos...</p>
            </div>
        </div>
    </main>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h3>Search</h3>
                <button class="close-search" id="closeSearch">&times;</button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search for documents, events, or information..." id="searchInput">
                <button class="search-submit">Search</button>
            </div>
        </div>
    </div>

    <!-- Footer loaded from footer.html -->
    <div id="footer-container"></div>

    <!-- Load shared navigation and footer -->
    <script src="nav-footer-loader.js"></script>

    <script src="memos-data.js"></script>
    <script src="memos-script.js"></script>
</body>
</html>
