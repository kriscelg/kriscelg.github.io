<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memos - WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="memos-styles.css">
</head>
<body data-page="communications">
    <!-- Navigation loaded from nav.html -->
    <div id="nav-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Memos</h1>
                <p>Access official memos and internal communications</p>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-container">
                <div class="search-bar">
                    <i class="fas fa-search search-icon"></i>
                    <input
                        type="text"
                        id="memoSearch"
                        class="search-input-memo"
                        placeholder="Search memos by title or subject..."
                    >
                    <button id="clearSearch" class="clear-search-btn" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="searchResults" class="search-results-info"></div>
            </div>

            <!-- Filter Options -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="yearFilter">Fiscal Year:</label>
                    <select id="yearFilter" class="filter-select">
                        <option value="all">All Years</option>
                    </select>
                </div>
            </div>

            <!-- Tag Filter Section -->
            <div class="filter-section">
                <div class="filter-header">
                    <span class="filter-label"><i class="fas fa-filter"></i> Filter by tags:</span>
                    <button class="clear-filters-btn" id="clearFilters">Clear All</button>
                </div>
                <div class="filter-tags" id="filterTags">
                    <!-- Tags will be dynamically generated -->
                </div>
            </div>

            <!-- Memos List -->
            <div class="memos-grid" id="memos-list">
                <p class="loading-message">Loading memos...</p>
            </div>
        </div>
    </main>

    <!-- PDF Viewer Modal -->
    <div class="modal" id="pdfModal">
        <div class="modal-content pdf-modal-content">
            <div class="modal-header">
                <h2 id="pdfModalTitle"></h2>
                <button class="modal-close" onclick="closePdfModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="pdf-viewer-container">
                    <iframe id="pdfViewer" src="" width="100%" height="600px"></iframe>
                </div>
                <div class="pdf-info">
                    <div class="pdf-meta">
                        <span class="pdf-date"><i class="fas fa-calendar"></i> <span id="pdfDate"></span></span>
                        <span class="pdf-number"><i class="fas fa-hashtag"></i> <span id="pdfNumber"></span></span>
                        <span class="pdf-from"><i class="fas fa-user"></i> <span id="pdfFrom"></span></span>
                    </div>
                    <p id="pdfDescription"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h3>Search</h3>
                <button class="close-search" id="closeSearch">&times;</button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search for documents, events, or information..." id="searchInput">
                <button class="search-submit">Search</button>
            </div>
        </div>
    </div>

    <!-- Footer loaded from footer.html -->
    <div id="footer-container"></div>

    <!-- Load shared navigation and footer -->
    <script src="nav-footer-loader.js"></script>

    <script src="memos-data.js"></script>
    <script src="memos-script.js"></script>
</body>
</html>
