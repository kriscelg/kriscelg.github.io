<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Speaker Series - WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="guest-speaker-series-styles.css">
</head>
<body data-page="communications">
    <div id="nav-container"></div>

    <main class="main-content">
        <div class="container">

            <!-- Page Header -->
            <div class="page-header">
                <h1>Guest Speaker Series</h1>
                <p>Recorded sessions and presentations from guest speakers across the division</p>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-container">
                <div class="search-bar">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="gsSearch" class="search-input-gs" placeholder="Search sessions by title or description...">
                    <button id="clearSearch" class="clear-search-btn" style="display:none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="sessionsCount" class="search-results-info"></div>
            </div>

            <!-- Year Filter -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="yearFilter">Fiscal Year:</label>
                    <select id="yearFilter" class="filter-select">
                        <option value="all">All Years</option>
                    </select>
                </div>
            </div>

            <!-- Sessions Grid -->
            <div class="sessions-grid" id="sessionsGrid">
                <p class="loading-message">Loading sessions&hellip;</p>
            </div>

        </div>
    </main>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h3>Search</h3>
                <button class="close-search" id="closeSearch">&times;</button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search for documents, events, or information..." id="searchInput">
                <button class="search-submit">Search</button>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="nav-footer-loader.js"></script>
    <script src="guest-speaker-series-data.js"></script>
    <script src="guest-speaker-series-script.js"></script>
    <script src="name-registry-data.js"></script>
</body>
</html>
