<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Calendar - WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="events-styles.css">
</head>
<body data-page="communications">
    <!-- Navigation loaded from nav.html -->
    <div id="nav-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <div class="header-left">
                    <h1>Events Calendar</h1>
                    <p>View upcoming events</p>
                </div>
            </div>

            <div class="events-layout">
                <!-- Calendar Section (Left) -->
                <div class="calendar-section">
                    <div class="calendar-container">
                        <!-- Calendar Navigation -->
                        <div class="calendar-header">
                            <button class="nav-btn" id="prevMonth">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <h2 id="currentMonth">November 2025</h2>
                            <button class="nav-btn" id="nextMonth">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>

                        <!-- Calendar Grid -->
                        <div class="calendar-grid">
                            <div class="day-header">Sun</div>
                            <div class="day-header">Mon</div>
                            <div class="day-header">Tue</div>
                            <div class="day-header">Wed</div>
                            <div class="day-header">Thu</div>
                            <div class="day-header">Fri</div>
                            <div class="day-header">Sat</div>
                            <!-- Calendar days will be populated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Event Details Section (Right) -->
                <div class="event-details-section">
                    <div class="event-details-panel" id="eventPanel">
                        <div class="panel-header">
                            <h3>Select a date</h3>
                        </div>
                        <div class="event-list" id="eventList">
                            <p class="no-events">Click on a date to view events scheduled for that day.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h3>Search</h3>
                <button class="close-search" id="closeSearch">&times;</button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search for documents, events, or information..." id="searchInput">
                <button class="search-submit">Search</button>
            </div>
        </div>
    </div>

    <!-- Footer loaded from footer.html -->
    <div id="footer-container"></div>

    <!-- Load shared navigation and footer -->
    <script src="nav-footer-loader.js"></script>

    <script src="events-data.js"></script>
    <script src="events-script.js"></script>
</body>
</html>
