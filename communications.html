<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletins & Newsletters - WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="communications-styles.css">
</head>
<body data-page="communications">
    <!-- Navigation loaded from nav.html -->
    <div id="nav-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Bulletins & Newsletters</h1>
                <p>Stay informed with our latest communications</p>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-container">
                <div class="search-bar">
                    <i class="fas fa-search search-icon"></i>
                    <input
                        type="text"
                        id="commSearch"
                        class="search-input-comm"
                        placeholder="Search bulletins and newsletters by name..."
                    >
                    <button id="clearSearch" class="clear-search-btn" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="searchResults" class="search-results-info"></div>
            </div>

            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="newsletters">
                    <i class="fas fa-newspaper"></i> Newsletters
                </button>
                <button class="tab-btn" data-tab="bulletins">
                    <i class="fas fa-bullhorn"></i> Bulletins
                </button>
            </div>

            <!-- Newsletters Tab -->
            <div class="tab-content active" id="newsletters-tab">
                <div class="communications-grid" id="newsletters-list">
                    <p class="loading-message">Loading newsletters...</p>
                </div>
            </div>

            <!-- Bulletins Tab -->
            <div class="tab-content" id="bulletins-tab">
                <div class="communications-grid" id="bulletins-list">
                    <p class="loading-message">Loading bulletins...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h3>Search</h3>
                <button class="close-search" id="closeSearch">&times;</button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search for documents, events, or information..." id="searchInput">
                <button class="search-submit">Search</button>
            </div>
        </div>
    </div>

    <!-- Footer loaded from footer.html -->
    <div id="footer-container"></div>

    <!-- Load shared navigation and footer -->
    <script src="nav-footer-loader.js"></script>

    <script src="communications-data.js"></script>
    <script src="communications-script.js"></script>
</body>
</html>
