<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms, Templates & Resources - WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="document-pages-styles.css">
</head>
<body data-page="documents">
    <!-- Navigation loaded from nav.html -->
    <div id="nav-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="docs-page-header-banner">
                <div class="docs-header-icon">
                    <i class="fas fa-toolbox"></i>
                </div>
                <div class="docs-header-text">
                    <h1>Forms, Templates & Resources</h1>
                    <p>Download forms, templates, and resources used across the division</p>
                </div>
            </div>

            <!-- Main Layout with Sidebar -->
            <div class="docs-layout">
                <!-- Left Sidebar -->
                <aside class="docs-sidebar">
                    <!-- Search Section -->
                    <div class="sidebar-section">
                        <h3 class="sidebar-section-title">
                            <i class="fas fa-search"></i>
                            Search
                        </h3>
                        <div class="sidebar-search">
                            <i class="fas fa-search sidebar-search-icon"></i>
                            <input
                                type="text"
                                id="documentSearch"
                                class="sidebar-search-input"
                                placeholder="Search documents..."
                            >
                            <button id="clearSearch" class="sidebar-clear-search" style="display: none;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div id="searchResults" class="search-results-info"></div>
                    </div>

                    <!-- Tag Filters Section -->
                    <div class="sidebar-section">
                        <h3 class="sidebar-section-title">
                            <i class="fas fa-filter"></i>
                            Filter by Tags
                        </h3>
                        <div class="tag-categories" id="tagCategories">
                            <!-- Tag categories will be dynamically generated -->
                        </div>
                        <button class="clear-all-filters" id="clearFilters">Clear All Filters</button>
                    </div>
                </aside>

                <!-- Main Content -->
                <div class="docs-main-content">
                    <!-- Active Filters Display -->
                    <div class="active-filters" id="activeFilters" style="display: none;">
                        <span class="active-filters-label">Active filters:</span>
                        <div class="active-filters-list" id="activeFiltersList"></div>
                    </div>

                    <!-- Documents Grid -->
                    <div class="documents-grid" id="documents-list">
                        <p class="loading-message">Loading documents...</p>
                    </div>

                    <!-- No Results Message -->
                    <div class="no-results-container" id="noResults" style="display: none;">
                        <i class="fas fa-search"></i>
                        <h3>No documents found</h3>
                        <p>Try adjusting your search or clearing filters</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h3>Search</h3>
                <button class="close-search" id="closeSearch">&times;</button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" placeholder="Search for documents, events, or information..." id="searchInput">
                <button class="search-submit">Search</button>
            </div>
        </div>
    </div>

    <!-- Footer loaded from footer.html -->
    <div id="footer-container"></div>

    <!-- Load shared navigation and footer -->
    <script src="nav-footer-loader.js"></script>
    <script src="documents-data.js"></script>
    <script>
        const documents = typeof FORMS_TEMPLATES_RESOURCES !== 'undefined' ? FORMS_TEMPLATES_RESOURCES : [];
        let filteredDocuments = [...documents];
        let activeSearchTerm = '';
        let activeTags = new Set();

        // Define tag categories for forms, templates and resources
        const TAG_CATEGORIES = {
            'Document Type': ['form', 'template', 'resource', 'tool'],
            'Purpose': ['project approval', 'funding', 'reporting', 'assessment'],
            'Program Area': ['TES', 'SIB', 'Apprenticeship', 'BITS', 'ELMP']
        };

        function encodeFilePath(filePath) {
            return filePath.split('/').map(part => encodeURIComponent(part)).join('/');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function getFileIcon(fileType) {
            const icons = {
                'HTML': 'fa-file-code',
                'PDF': 'fa-file-pdf',
                'DOCX': 'fa-file-word',
                'DOC': 'fa-file-word',
                'XLSX': 'fa-file-excel',
                'XLS': 'fa-file-excel',
                'PPTX': 'fa-file-powerpoint',
                'PPT': 'fa-file-powerpoint',
                'TXT': 'fa-file-alt'
            };
            return icons[fileType.toUpperCase()] || 'fa-file';
        }

        function countTagDocuments(tag) {
            return documents.filter(doc => doc.tags && doc.tags.includes(tag)).length;
        }

        function renderDocuments(docs) {
            const container = document.getElementById('documents-list');
            const noResults = document.getElementById('noResults');

            if (docs.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'flex';
                return;
            }

            noResults.style.display = 'none';
            container.innerHTML = docs.map(doc => `
                <a href="${encodeFilePath(doc.fileName)}" class="document-card" target="_blank">
                    <div class="doc-icon">
                        <i class="fas ${getFileIcon(doc.fileType)}"></i>
                    </div>
                    <div class="doc-content">
                        <h3 class="doc-title">${doc.title}</h3>
                        <div class="doc-meta">
                            <span class="doc-meta-item">
                                <i class="fas fa-calendar"></i> ${formatDate(doc.uploadDate)}
                            </span>
                            <span class="doc-meta-item doc-type">
                                <i class="fas fa-tag"></i> ${doc.fileType}
                            </span>
                        </div>
                    </div>
                    <div class="doc-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </a>
            `).join('');

            updateSearchResults(docs.length);
        }

        function generateTagFilters() {
            const tagCategoriesContainer = document.getElementById('tagCategories');

            const categoriesHTML = Object.entries(TAG_CATEGORIES).map(([categoryName, tags]) => {
                const categoryTagsHTML = tags.map(tag => {
                    const count = countTagDocuments(tag);
                    if (count === 0) return '';
                    return `
                        <div class="tag-filter-item" data-tag="${tag}">
                            <div class="tag-filter-checkbox">
                                <i class="fas fa-check"></i>
                            </div>
                            <span class="tag-filter-label">${tag}</span>
                            <span class="tag-filter-count">${count}</span>
                        </div>
                    `;
                }).filter(html => html !== '').join('');

                if (categoryTagsHTML === '') return '';

                return `
                    <div class="tag-category">
                        <div class="tag-category-header">
                            <span class="tag-category-title">${categoryName}</span>
                            <i class="fas fa-chevron-down tag-category-toggle"></i>
                        </div>
                        <div class="tag-category-items">
                            ${categoryTagsHTML}
                        </div>
                    </div>
                `;
            }).join('');

            tagCategoriesContainer.innerHTML = categoriesHTML || '<p class="no-tags-message" style="text-align: center; color: #94a3b8; font-size: 13px; margin: 10px 0;">No tags available</p>';

            document.querySelectorAll('.tag-category-header').forEach(header => {
                header.addEventListener('click', () => {
                    const category = header.closest('.tag-category');
                    category.classList.toggle('collapsed');
                });
            });

            document.querySelectorAll('.tag-filter-item').forEach(item => {
                item.addEventListener('click', () => {
                    const tag = item.dataset.tag;
                    if (activeTags.has(tag)) {
                        activeTags.delete(tag);
                        item.classList.remove('active');
                    } else {
                        activeTags.add(tag);
                        item.classList.add('active');
                    }
                    filterDocuments();
                    updateActiveFilters();
                });
            });
        }

        function updateActiveFilters() {
            const activeFiltersContainer = document.getElementById('activeFilters');
            const activeFiltersList = document.getElementById('activeFiltersList');

            if (activeTags.size === 0) {
                activeFiltersContainer.style.display = 'none';
                return;
            }

            activeFiltersContainer.style.display = 'flex';
            activeFiltersList.innerHTML = Array.from(activeTags).map(tag => `
                <span class="active-filter-chip" data-tag="${tag}">
                    ${tag}
                    <button class="remove-filter-btn" onclick="removeFilter('${tag}')">
                        <i class="fas fa-times"></i>
                    </button>
                </span>
            `).join('');
        }

        function removeFilter(tag) {
            activeTags.delete(tag);
            document.querySelector(`.tag-filter-item[data-tag="${tag}"]`)?.classList.remove('active');
            filterDocuments();
            updateActiveFilters();
        }

        function filterDocuments() {
            filteredDocuments = documents.filter(doc => {
                const matchesSearch = !activeSearchTerm ||
                    doc.title.toLowerCase().includes(activeSearchTerm.toLowerCase());

                const matchesTags = activeTags.size === 0 ||
                    (doc.tags && Array.from(activeTags).every(tag => doc.tags.includes(tag)));

                return matchesSearch && matchesTags;
            });

            renderDocuments(filteredDocuments);
        }

        function updateSearchResults(count) {
            const resultsInfo = document.getElementById('searchResults');
            if (activeSearchTerm || activeTags.size > 0) {
                resultsInfo.textContent = `Found ${count} document${count !== 1 ? 's' : ''}`;
                resultsInfo.classList.add('active');
            } else {
                resultsInfo.textContent = '';
                resultsInfo.classList.remove('active');
            }
        }

        const searchInput = document.getElementById('documentSearch');
        const clearSearchBtn = document.getElementById('clearSearch');

        searchInput.addEventListener('input', (e) => {
            activeSearchTerm = e.target.value;
            clearSearchBtn.style.display = activeSearchTerm ? 'flex' : 'none';
            filterDocuments();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            activeSearchTerm = '';
            clearSearchBtn.style.display = 'none';
            filterDocuments();
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            activeTags.clear();
            document.querySelectorAll('.tag-filter-item').forEach(item => item.classList.remove('active'));
            filterDocuments();
            updateActiveFilters();
        });

        generateTagFilters();
        renderDocuments(documents);
    </script>
</body>
</html>
