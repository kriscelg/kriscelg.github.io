function uid() { return ++_uid; }

function defaultBlock(type) {
    const b = { _id: uid(), _type: type };
    if (type === 'header') {
        b.title = ''; b.docType = 'Policy'; b.lastUpdated = ''; b.department = 'TES';
    } else if (type === 'flag') {
        b.text = ''; b.style = 'info';
    } else if (type === 'section' || type === 'subsection' || type === 'subsubsection') {
        b.title = '';
    } else if (type === 'paragraph') {
        b.text = '';
    } else if (type === 'note') {
        b.style = 'info'; b.text = '';
    } else if (type === 'list') {
        b.listType = 'unordered'; b._items = [''];
    } else if (type === 'table') {
        b._headers = ['Column 1', 'Column 2', 'Column 3'];
        b._rows = [['', '', '']];
    } else if (type === 'faq') {
        b._faqs = [{ q: '', a: '' }];
    } else if (type === 'button') {
        b.label = ''; b.href = ''; b.newTab = false;
    } else if (type === 'image') {
        b.src = ''; b.alt = ''; b.caption = ''; b.width = '';
    } else if (type === 'supporting-docs') {
        b.title = 'Supporting Documents'; b._docs = [{ label: '', url: '' }];
    } else if (type === 'version-history') {
        b._versions = [{ ver: '', date: '', author: '', desc: '' }];
    }
    return b;
}

// ── Init ──────────────────────────────────────────────────
function init() {
    renderAddBar();
    // Default initial blocks
    const hb = defaultBlock('header');
    hb.title = 'Document Title';
    hb.docType = 'Policy';
    hb.department = 'TES';
    blocks.push(hb);
    const sb = defaultBlock('section');
    sb.title = 'Description';
    blocks.push(sb);
    const pb = defaultBlock('paragraph');
    pb.text = 'Enter your content here.';
    blocks.push(pb);

    renderAll();
    document.getElementById('btnCopy').addEventListener('click', copyHTML);
    document.getElementById('btnReset').addEventListener('click', () => {
        if (!confirm('Reset all blocks? This cannot be undone.')) return;
        blocks = [];
        selectedId = null;
        blocks.push(Object.assign(defaultBlock('header'), { title: 'Page Title' }));
        blocks.push(Object.assign(defaultBlock('section'), { title: 'Description' }));
        blocks.push(Object.assign(defaultBlock('paragraph'), { text: 'Enter your content here.' }));
        renderAll();
    });
}

// ── Render block list ─────────────────────────────────────
function renderAll() {
    const list = document.getElementById('blockList');
    list.innerHTML = '';
    blocks.forEach((b, idx) => {
        list.appendChild(buildBlockItem(b, idx));
    });
    document.getElementById('block-count').textContent = blocks.length + ' block' + (blocks.length !== 1 ? 's' : '');
    refreshPreview(true);
}

function buildBlockItem(b, idx) {
    const def = BLOCK_DEFS[b._type];
    const wrap = document.createElement('div');
    wrap.className = 'pb-block-item' + (b._id === selectedId ? ' selected' : '');
    wrap.dataset.id = b._id;

    const header = document.createElement('div');
    header.className = 'pb-block-header';
    header.innerHTML = `
        <span class="pb-block-type-badge badge-${b._type}">${def.label}</span>
        <span class="pb-block-preview">${escHtml(def.preview(b))}</span>
        <div class="pb-block-actions">
            ${idx > 0 ? `<button class="pb-block-act-btn" title="Move up" data-act="up"><i class="fas fa-chevron-up"></i></button>` : ''}
            ${idx < blocks.length - 1 ? `<button class="pb-block-act-btn" title="Move down" data-act="down"><i class="fas fa-chevron-down"></i></button>` : ''}
            <button class="pb-block-act-btn dup" title="Duplicate" data-act="dup"><i class="fas fa-copy"></i></button>
            <button class="pb-block-act-btn del" title="Delete" data-act="del"><i class="fas fa-trash"></i></button>
        </div>
    `;

    header.addEventListener('click', e => {
        const act = e.target.closest('[data-act]');
        if (act) {
            handleAct(b._id, act.dataset.act);
            return;
        }
        selectedId = (selectedId === b._id) ? null : b._id;
        renderAll();
    });

    const form = document.createElement('div');
    form.className = 'pb-block-form';
    buildForm(b, form);

    wrap.appendChild(header);
    wrap.appendChild(form);
    return wrap;
}

function handleAct(id, act) {
    const idx = blocks.findIndex(b => b._id === id);
    if (idx === -1) return;
    if (act === 'up' && idx > 0) {
        [blocks[idx - 1], blocks[idx]] = [blocks[idx], blocks[idx - 1]];
    } else if (act === 'down' && idx < blocks.length - 1) {
        [blocks[idx], blocks[idx + 1]] = [blocks[idx + 1], blocks[idx]];
    } else if (act === 'dup') {
        const copy = JSON.parse(JSON.stringify(blocks[idx]));
        copy._id = uid();
        blocks.splice(idx + 1, 0, copy);
        selectedId = copy._id;
    } else if (act === 'del') {
        blocks.splice(idx, 1);
        if (selectedId === id) selectedId = null;
    }
    renderAll();
}

// ── Form builder ─────────────────────────────────────────
function buildForm(b, container) {
    const def = BLOCK_DEFS[b._type];
    def.fields.forEach(f => {
        const wrap = document.createElement('div');
        wrap.className = 'pb-field';
        const lbl = document.createElement('label');
        lbl.textContent = f.label;
        wrap.appendChild(lbl);

        if (f.type === 'text' || f.type === 'url') {
            const inp = document.createElement('input');
            inp.type = f.type === 'url' ? 'url' : 'text';
            inp.value = b[f.key] || '';
            inp.placeholder = f.placeholder || '';
            inp.addEventListener('input', () => { b[f.key] = inp.value; refreshPreview(); updatePreview(b); });
            wrap.appendChild(inp);
        } else if (f.type === 'textarea') {
            const ta = document.createElement('textarea');
            ta.value = b[f.key] || '';
            ta.placeholder = f.placeholder || '';
            ta.rows = 4;
            ta.addEventListener('input', () => { b[f.key] = ta.value; refreshPreview(); updatePreview(b); });
            wrap.appendChild(ta);
            const hint = document.createElement('div');
            hint.className = 'pb-field-hint';
            hint.textContent = 'Markup: **bold**, [text](url), [text](url){new}';
            wrap.appendChild(hint);
        } else if (f.type === 'select') {
            const sel = document.createElement('select');
            (f.options || []).forEach(opt => {
                const o = document.createElement('option');
                o.value = opt; o.textContent = opt || '— none —';
                if (b[f.key] === opt) o.selected = true;
                sel.appendChild(o);
            });
            sel.addEventListener('change', () => { b[f.key] = sel.value; refreshPreview(true); updatePreview(b); });
            wrap.appendChild(sel);
        } else if (f.type === 'toggle') {
            const row = document.createElement('div');
            row.className = 'pb-toggle-row';
            const tog = document.createElement('label');
            tog.className = 'pb-toggle';
            const inp = document.createElement('input');
            inp.type = 'checkbox';
            inp.checked = !!b[f.key];
            const slider = document.createElement('span');
            slider.className = 'pb-toggle-slider';
            tog.appendChild(inp);
            tog.appendChild(slider);
            const togLbl = document.createElement('span');
            togLbl.className = 'pb-toggle-label';
            togLbl.textContent = f.placeholder || f.label;
            inp.addEventListener('change', () => { b[f.key] = inp.checked; refreshPreview(true); });
            row.appendChild(tog);
            row.appendChild(togLbl);
            wrap.appendChild(row);
        } else if (f.type === 'repeater-text') {
            wrap.appendChild(buildRepeaterText(b));
        } else if (f.type === 'table-editor') {
            wrap.appendChild(buildTableEditor(b));
        } else if (f.type === 'faq-editor') {
            wrap.appendChild(buildFaqEditor(b));
        } else if (f.type === 'sdocs-editor') {
            wrap.appendChild(buildSdocsEditor(b));
        } else if (f.type === 'vh-editor') {
            wrap.appendChild(buildVhEditor(b));
        }

        container.appendChild(wrap);
    });
}

function updatePreview(b) {
    // Update the preview text in the block header without full re-render
    const def = BLOCK_DEFS[b._type];
    const item = document.querySelector(`.pb-block-item[data-id="${b._id}"] .pb-block-preview`);
    if (item) item.textContent = def.preview(b);
}

// ── Repeater: plain text items ────────────────────────────
function buildRepeaterText(b) {
    if (!b._items) b._items = [''];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';
        b._items.forEach((item, i) => {
            const row = document.createElement('div');
            row.className = 'repeater-row';
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = item;
            inp.placeholder = 'List item';
            inp.addEventListener('input', () => { b._items[i] = inp.value; refreshPreview(); });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._items.splice(i, 1); if (!b._items.length) b._items.push(''); render(); refreshPreview(true); });
            row.appendChild(inp);
            row.appendChild(del);
            wrap.appendChild(row);
        });
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'tbl-add-row';
        add.textContent = '+ Add item';
        add.addEventListener('click', () => { b._items.push(''); render(); refreshPreview(true); });
        wrap.appendChild(add);
    }
    render();
    return wrap;
}

// ── Table editor ──────────────────────────────────────────
function buildTableEditor(b) {
    if (!b._headers) b._headers = ['Column 1', 'Column 2', 'Column 3'];
    if (!b._rows) b._rows = [['', '', '']];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';

        // Header row
        const hdrLbl = document.createElement('div');
        hdrLbl.style.cssText = 'font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;';
        hdrLbl.textContent = 'Column Headers';
        wrap.appendChild(hdrLbl);

        const hdrRow = document.createElement('div');
        hdrRow.className = 'tbl-row';
        b._headers.forEach((h, ci) => {
            const inp = document.createElement('input');
            inp.value = h;
            inp.placeholder = 'Header ' + (ci + 1);
            inp.addEventListener('input', () => { b._headers[ci] = inp.value; refreshPreview(); });
            hdrRow.appendChild(inp);
        });
        const addCol = document.createElement('button');
        addCol.type = 'button';
        addCol.className = 'tbl-row-del';
        addCol.innerHTML = '<i class="fas fa-plus"></i>';
        addCol.title = 'Add column';
        addCol.style.color = '#0d5f5f';
        addCol.addEventListener('click', () => {
            b._headers.push('Column ' + (b._headers.length + 1));
            b._rows.forEach(r => r.push(''));
            render(); refreshPreview(true);
        });
        hdrRow.appendChild(addCol);
        wrap.appendChild(hdrRow);

        // Data rows
        const rowsLbl = document.createElement('div');
        rowsLbl.style.cssText = 'font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;';
        rowsLbl.textContent = 'Rows';
        wrap.appendChild(rowsLbl);

        b._rows.forEach((row, ri) => {
            const rowEl = document.createElement('div');
            rowEl.className = 'tbl-row';
            b._headers.forEach((_, ci) => {
                const inp = document.createElement('input');
                inp.value = row[ci] || '';
                inp.placeholder = 'Cell';
                inp.addEventListener('input', () => { b._rows[ri][ci] = inp.value; refreshPreview(); });
                rowEl.appendChild(inp);
            });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._rows.splice(ri, 1); render(); refreshPreview(true); });
            rowEl.appendChild(del);
            wrap.appendChild(rowEl);
        });

        const addRow = document.createElement('button');
        addRow.type = 'button';
        addRow.className = 'tbl-add-row';
        addRow.textContent = '+ Add row';
        addRow.addEventListener('click', () => {
            b._rows.push(b._headers.map(() => ''));
            render(); refreshPreview(true);
        });
        wrap.appendChild(addRow);
    }
    render();
    return wrap;
}

// ── FAQ editor ────────────────────────────────────────────
function buildFaqEditor(b) {
    if (!b._faqs) b._faqs = [{ q: '', a: '' }];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';
        b._faqs.forEach((faq, i) => {
            const qrow = document.createElement('div');
            qrow.className = 'repeater-row';
            const qinp = document.createElement('input');
            qinp.type = 'text';
            qinp.value = faq.q;
            qinp.placeholder = 'Question ' + (i + 1);
            qinp.addEventListener('input', () => { b._faqs[i].q = qinp.value; refreshPreview(); });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._faqs.splice(i, 1); if (!b._faqs.length) b._faqs.push({q:'',a:''}); render(); refreshPreview(true); });
            qrow.appendChild(qinp);
            qrow.appendChild(del);
            wrap.appendChild(qrow);

            const arow = document.createElement('div');
            arow.className = 'repeater-row';
            const ata = document.createElement('textarea');
            ata.value = faq.a;
            ata.placeholder = 'Answer';
            ata.rows = 2;
            ata.addEventListener('input', () => { b._faqs[i].a = ata.value; refreshPreview(); });
            arow.appendChild(ata);
            wrap.appendChild(arow);

            if (i < b._faqs.length - 1) {
                const sep = document.createElement('hr');
                sep.style.cssText = 'border:none;border-top:1px solid #e5e7eb;margin:4px 0 8px;';
                wrap.appendChild(sep);
            }
        });
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'tbl-add-row';
        add.textContent = '+ Add Q&A';
        add.addEventListener('click', () => { b._faqs.push({q:'',a:''}); render(); refreshPreview(true); });
        wrap.appendChild(add);
    }
    render();
    return wrap;
}

// ── Supporting docs editor ────────────────────────────────
function buildSdocsEditor(b) {
    if (!b._docs) b._docs = [{ label: '', url: '' }];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';
        const hdr = document.createElement('div');
        hdr.style.cssText = 'display:grid;grid-template-columns:1fr 1fr auto;gap:4px;margin-bottom:4px;';
        hdr.innerHTML = '<span style="font-size:11px;color:#94a3b8;">Label</span><span style="font-size:11px;color:#94a3b8;">URL</span><span></span>';
        wrap.appendChild(hdr);

        b._docs.forEach((doc, i) => {
            const row = document.createElement('div');
            row.className = 'sdoc-row';
            const linp = document.createElement('input');
            linp.type = 'text';
            linp.value = doc.label;
            linp.placeholder = 'Document label';
            linp.addEventListener('input', () => { b._docs[i].label = linp.value; refreshPreview(); });
            const uinp = document.createElement('input');
            uinp.type = 'text';
            uinp.value = doc.url;
            uinp.placeholder = 'URL or file path';
            uinp.addEventListener('input', () => { b._docs[i].url = uinp.value; refreshPreview(); });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._docs.splice(i, 1); if (!b._docs.length) b._docs.push({label:'',url:''}); render(); refreshPreview(true); });
            row.appendChild(linp);
            row.appendChild(uinp);
            row.appendChild(del);
            wrap.appendChild(row);
        });
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'tbl-add-row';
        add.textContent = '+ Add document';
        add.addEventListener('click', () => { b._docs.push({label:'',url:''}); render(); refreshPreview(true); });
        wrap.appendChild(add);
    }
    render();
    return wrap;
}

// ── Version history editor ────────────────────────────────
function buildVhEditor(b) {
    if (!b._versions) b._versions = [{ ver: '', date: '', author: '', desc: '' }];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';
        const hdr = document.createElement('div');
        hdr.style.cssText = 'display:grid;grid-template-columns:56px 100px 1fr 1fr auto;gap:4px;margin-bottom:4px;';
        hdr.innerHTML = '<span style="font-size:11px;color:#94a3b8;">Ver.</span><span style="font-size:11px;color:#94a3b8;">Date</span><span style="font-size:11px;color:#94a3b8;">Updated By</span><span style="font-size:11px;color:#94a3b8;">Changes</span><span></span>';
        wrap.appendChild(hdr);

        b._versions.forEach((v, i) => {
            const row = document.createElement('div');
            row.style.cssText = 'display:grid;grid-template-columns:56px 100px 1fr 1fr auto;gap:4px;margin-bottom:4px;';
            const vinp = document.createElement('input'); vinp.type='text'; vinp.value=v.ver||''; vinp.placeholder='1.0';
            vinp.addEventListener('input', () => { b._versions[i].ver = vinp.value; refreshPreview(); });
            const dinp = document.createElement('input'); dinp.type='text'; dinp.value=v.date||''; dinp.placeholder='May 5, 2026';
            dinp.addEventListener('input', () => { b._versions[i].date = dinp.value; refreshPreview(); });
            const ainp = document.createElement('input'); ainp.type='text'; ainp.value=v.author||''; ainp.placeholder='Author name';
            ainp.addEventListener('input', () => { b._versions[i].author = ainp.value; refreshPreview(); });
            const desc = document.createElement('input'); desc.type='text'; desc.value=v.desc||''; desc.placeholder='Changes made';
            desc.addEventListener('input', () => { b._versions[i].desc = desc.value; refreshPreview(); });
            const del = document.createElement('button'); del.type='button'; del.className='tbl-row-del'; del.innerHTML='<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._versions.splice(i,1); if (!b._versions.length) b._versions.push({ver:'',date:'',author:'',desc:''}); render(); refreshPreview(true); });
            [vinp,dinp,ainp,desc,del].forEach(el => row.appendChild(el));
            wrap.appendChild(row);
        });
        const add = document.createElement('button'); add.type='button'; add.className='tbl-add-row'; add.textContent='+ Add version';
        add.addEventListener('click', () => { b._versions.push({ver:'',date:'',author:'',desc:''}); render(); refreshPreview(true); });
        wrap.appendChild(add);
    }
    render();
    return wrap;
}

// ── Add bar ───────────────────────────────────────────────
function renderAddBar() {
    const bar = document.getElementById('addBar');
    bar.innerHTML = '';
    Object.entries(BLOCK_DEFS).forEach(([type, def]) => {
        const btn = document.createElement('button');
        btn.className = 'pb-add-btn';
        btn.innerHTML = `<i class="fas fa-plus" style="font-size:10px;"></i> ${def.label}`;
        btn.addEventListener('click', () => {
            const b = defaultBlock(type);
            blocks.push(b);
            selectedId = b._id;
            renderAll();
            // Scroll new block into view
            setTimeout(() => {
                const el = document.querySelector(`.pb-block-item[data-id="${b._id}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 50);
        });
        bar.appendChild(btn);
    });
}

// ── Inline markup parser ──────────────────────────────────
function parseInline(text) {
    if (!text) return '';
    // Escape HTML first
    let s = escHtml(text);
    // **bold**
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // [text](url){new} — new tab
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)\{new\}/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return s;
}

// ── HTML generator ────────────────────────────────────────

function generateHTML(forPreview) {
    const hb = blocks.find(b => b._type === 'header') || {};
    const title       = hb.title       || 'Untitled Document';
    const docType     = hb.docType     || 'Policy';
    const lastUpdated = hb.lastUpdated || '';
    const department  = hb.department  || '';
    const cssBase     = '../';

    const contentBlocks = blocks.filter(b =>
        b._type !== 'header' && b._type !== 'supporting-docs' && b._type !== 'version-history'
    );
    const supDocsBlock = blocks.find(b => b._type === 'supporting-docs');
    const verHistBlock = blocks.find(b => b._type === 'version-history');

    const bodyHtml    = buildBodyHtml(contentBlocks);
    const supDocsHtml = supDocsBlock ? buildSupDocsHtml(supDocsBlock) : '';
    const verHistHtml = verHistBlock ? buildVerHistHtml(verHistBlock) : '';

    const cssTag = forPreview
        ? `    <style>\n${_cssContent}\n    </style>`
        : `    <link rel="stylesheet" href="${cssBase}html-document-styles.css">`;
    const jsTag = forPreview
        ? `    <script>\n${_jsContent}\n    <\/script>`
        : `    <script src="${cssBase}html-document-script.js"><\/script>`;

    return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${escHtml(title)}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
${cssTag}
</head>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
    <button id="scrollToTopBtn" title="Back to top"><i class="fas fa-chevron-up"></i></button>

    <div class="policy-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">${escHtml(title)}</div>
                <div class="sidebar-subtitle">Navigation</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
        </aside>

        <main class="main-content">
            <header class="document-header">
                <h1 class="document-title">${escHtml(title)}</h1>
                <div class="document-meta">
                    <div class="meta-item">
                        <i class="fas fa-file-alt"></i>
                        <span class="meta-label">Document Type:</span>
                        <span>${escHtml(docType)}</span>
                    </div>${lastUpdated ? `
                    <div class="meta-item">
                        <i class="fas fa-calendar"></i>
                        <span class="meta-label">Last Updated:</span>
                        <span>${escHtml(lastUpdated)}</span>
                    </div>` : ''}${department ? `
                    <div class="meta-item">
                        <i class="fas fa-building"></i>
                        <span class="meta-label">Branch:</span>
                        <span>${escHtml(department)}</span>
                    </div>` : ''}
                </div>
            </header>

            <div class="terminology-notice">
                <i class="fas fa-info-circle"></i>
                <span>This document follows the standard internal terminology defined on the <a href="${cssBase}documents.html">Documents homepage</a></span>
            </div>

            <article class="document-content">
${bodyHtml}
            </article>
${supDocsHtml}${verHistHtml}
        </main>
    </div>

${jsTag}
</body>
</html>`;
}

function buildBodyHtml(contentBlocks) {
    let html = '';
    let sectionOpen = false;
    let subsectionOpen = false;
    const i0 = '                ';    // 16 sp — inside article
    const i1 = '                    '; // 20 sp — inside section
    const i2 = '                        '; // 24 sp — inside subsection div

    contentBlocks.forEach(b => {
        if (b._type === 'section') {
            if (subsectionOpen) { html += i1 + '</div>\n'; subsectionOpen = false; }
            if (sectionOpen)    { html += i0 + '</section>\n\n'; }
            html += `${i0}<section class="section" id="${escHtml(b.title || 'section')}">\n`;
            html += `${i1}<h2 class="section-title">${escHtml(b.title || '')}</h2>\n`;
            sectionOpen = true;
        } else if (b._type === 'subsection') {
            if (subsectionOpen) { html += i1 + '</div>\n'; }
            html += `${i1}<div id="${escHtml(b.title || 'subsection')}">\n`;
            html += `${i2}<h3 class="subsection-title">${escHtml(b.title || '')}</h3>\n`;
            subsectionOpen = true;
        } else if (b._type === 'subsubsection') {
            const ind = subsectionOpen ? i2 : i1;
            html += `${ind}<h4 class="sub-subsection-title" id="${escHtml(b.title || 'sub')}">${escHtml(b.title || '')}</h4>\n`;
        } else {
            const ind = subsectionOpen ? i2 : (sectionOpen ? i1 : i0);
            html += renderBlockHtml(b, ind);
        }
    });

    if (subsectionOpen) html += i1 + '</div>\n';
    if (sectionOpen)    html += i0 + '</section>\n';
    return html;
}

function renderBlockHtml(b, ind) {
    switch (b._type) {
        case 'flag':
            return `${ind}<div class="document-flag">\n${ind}    <strong>${escHtml(b.text || '')}</strong>\n${ind}</div>\n`;
        case 'paragraph':
            return `${ind}<p>${parseInline(b.text || '')}</p>\n`;
        case 'note':
            return `${ind}<div class="note">\n${ind}    <p>${parseInline(b.text || '')}</p>\n${ind}</div>\n`;
        case 'list': {
            const tag = b.listType === 'ordered' ? 'ol' : 'ul';
            const items = (b._items || []).filter(i => i.trim()).map(i => `${ind}    <li>${parseInline(i)}</li>`).join('\n');
            return items ? `${ind}<${tag}>\n${items}\n${ind}</${tag}>\n` : '';
        }
        case 'table': {
            const hdrs = (b._headers || []).map(h => `<th>${escHtml(h)}</th>`).join('');
            const rows = (b._rows || []).map(r => {
                const cells = (b._headers || []).map((_, ci) => `<td>${parseInline(r[ci] || '')}</td>`).join('');
                return `${ind}        <tr>${cells}</tr>`;
            }).join('\n');
            return `${ind}<table class="data-table">\n${ind}    <thead><tr>${hdrs}</tr></thead>\n${ind}    <tbody>\n${rows}\n${ind}    </tbody>\n${ind}</table>\n`;
        }
        case 'faq': {
            const items = (b._faqs || []).filter(f => f.q || f.a).map(f =>
                `${ind}<details class="faq-item">\n${ind}    <summary class="faq-question">${escHtml(f.q || '')}</summary>\n${ind}    <div class="faq-answer"><p>${parseInline(f.a || '')}</p></div>\n${ind}</details>`
            ).join('\n');
            return items ? items + '\n' : '';
        }
        case 'button': {
            const target = b.newTab ? ' target="_blank" rel="noopener noreferrer"' : '';
            return `${ind}<div class="doc-btn-group">\n${ind}    <a href="${escHtml(b.href || '#')}" class="doc-btn doc-btn-primary"${target}>${escHtml(b.label || 'Click here')}</a>\n${ind}</div>\n`;
        }
        case 'image': {
            const caption = b.caption ? `\n${ind}<p style="font-size:13px;color:#64748b;text-align:center;margin-top:6px;">${escHtml(b.caption)}</p>` : '';
            return `${ind}<img src="${escHtml(b.src || '')}" alt="${escHtml(b.alt || '')}" class="document-image">${caption}\n`;
        }
        default: return '';
    }
}

function buildSupDocsHtml(b) {
    const docs = (b._docs || []).filter(d => d.label || d.url);
    if (!docs.length) return '';
    const links = docs.map(d =>
        `                <a href="${escHtml(d.url || '#')}" class="document-link">\n                    <i class="fas fa-file-alt"></i>\n                    <span>${escHtml(d.label || d.url)}</span>\n                </a>`
    ).join('\n');
    return `            <section class="linked-documents" id="Support Documents">
                <h2 class="section-heading"><i class="fas fa-link"></i> Supporting Documents</h2>
                <div class="document-links">
${links}
                </div>
            </section>\n`;
}

function buildVerHistHtml(b) {
    const rows = (b._versions || []).filter(v => v.date || v.desc || v.ver);
    if (!rows.length) return '';
    const trs = rows.map(v =>
        `                    <tr>\n                        <td><span class="version-number">${escHtml(v.ver||'')}</span></td>\n                        <td>${escHtml(v.date||'')}</td>\n                        <td>${escHtml(v.author||'')}</td>\n                        <td>${escHtml(v.desc||'')}</td>\n                    </tr>`
    ).join('\n');
    return `            <section class="version-history" id="Version History">
                <h2 class="section-heading"><i class="fas fa-history"></i> Version History</h2>
                <table class="version-table">
                    <thead><tr><th>Version</th><th>Date</th><th>Updated By</th><th>Changes</th></tr></thead>
                    <tbody>
${trs}
                    </tbody>
                </table>
            </section>\n`;
}

// ── Preview ───────────────────────────────────────────────
let _previewTimer = null;
function refreshPreview(immediate) {
    clearTimeout(_previewTimer);
    const run = () => {
        const iframe = document.getElementById('pb-preview');
        const html = generateHTML(true);
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        iframe.src = url;
    };
    if (immediate) run(); else _previewTimer = setTimeout(run, 500);
}

// ── Copy HTML ─────────────────────────────────────────────
function copyHTML() {
    const html = generateHTML(false);
    navigator.clipboard.writeText(html).then(() => {
        const toast = document.getElementById('copy-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
    });
}

// ── Helpers ───────────────────────────────────────────────
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ── Boot (after all declarations) ────────────────────────
if (sessionStorage.getItem(SESSION_KEY) === '1') showApp();
