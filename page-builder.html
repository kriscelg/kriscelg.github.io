<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Builder — WDT Intranet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #1e293b; font-size: 14px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* ── Password Gate ────────────────────────────── */
        #pb-gate {
            position: fixed; inset: 0; background: #0d5f5f;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .gate-card {
            background: #fff; border-radius: 12px;
            padding: 48px 40px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
        }
        .gate-logo { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        .gate-title { font-size: 22px; font-weight: 800; color: #0d5f5f; margin-bottom: 6px; }
        .gate-sub { font-size: 13px; color: #64748b; margin-bottom: 32px; }
        .gate-input {
            width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0;
            border-radius: 8px; font-size: 15px; font-family: inherit;
            outline: none; transition: border-color .2s;
        }
        .gate-input:focus { border-color: #0d5f5f; }
        .gate-btn {
            width: 100%; margin-top: 14px; padding: 13px;
            background: #0d5f5f; color: #fff; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: background .2s;
        }
        .gate-btn:hover { background: #0a4a4a; }
        .gate-error { margin-top: 10px; font-size: 13px; color: #dc2626; display: none; }

        /* ── Top Bar ──────────────────────────────────── */
        #pb-app { display: none; flex-direction: column; height: 100vh; }
        .pb-topbar {
            background: #0d5f5f; color: #fff; height: 48px; flex-shrink: 0;
            display: flex; align-items: center; padding: 0 16px; gap: 12px;
        }
        .pb-topbar a { color: rgba(255,255,255,0.7); font-size: 13px; text-decoration: none; }
        .pb-topbar a:hover { color: #fff; }
        .pb-topbar-sep { color: rgba(255,255,255,0.3); }
        .pb-topbar-title { font-size: 15px; font-weight: 700; flex: 1; }
        .pb-topbar-actions { display: flex; gap: 8px; }
        .pb-btn {
            padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
            font-family: inherit; cursor: pointer; border: none; transition: background .15s;
        }
        .pb-btn-outline {
            background: transparent; color: #fff;
            border: 1.5px solid rgba(255,255,255,0.4);
        }
        .pb-btn-outline:hover { background: rgba(255,255,255,0.1); }
        .pb-btn-primary { background: #fff; color: #0d5f5f; }
        .pb-btn-primary:hover { background: #e0f2f2; }
        .pb-btn-danger { background: #dc2626; color: #fff; }
        .pb-btn-danger:hover { background: #b91c1c; }

        /* ── Main Layout ──────────────────────────────── */
        .pb-main {
            flex: 1; display: flex; min-height: 0;
        }

        /* ── Left Panel: Block List ───────────────────── */
        .pb-left {
            width: 42%; border-right: 1px solid #d1d5db;
            display: flex; flex-direction: column; background: #fff; min-height: 0;
        }
        .pb-panel-header {
            padding: 12px 16px; border-bottom: 1px solid #e5e7eb;
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: #64748b; background: #f8fafc;
            display: flex; align-items: center; justify-content: space-between;
        }
        .pb-panel-header span { color: #94a3b8; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; }
        .pb-block-list {
            flex: 1; overflow-y: auto; padding: 8px;
        }
        .pb-block-item {
            border: 1.5px solid #e5e7eb; border-radius: 8px; margin-bottom: 6px;
            background: #fff; cursor: default; transition: border-color .15s;
        }
        .pb-block-item.selected { border-color: #0d5f5f; box-shadow: 0 0 0 3px rgba(13,95,95,0.1); }
        .pb-block-header {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px; cursor: pointer;
        }
        .pb-block-type-badge {
            font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
            padding: 2px 7px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0;
        }
        .pb-block-preview {
            flex: 1; font-size: 13px; color: #374151; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .pb-block-actions {
            display: flex; gap: 2px; flex-shrink: 0;
        }
        .pb-block-act-btn {
            background: none; border: none; padding: 4px 6px; border-radius: 4px;
            cursor: pointer; color: #9ca3af; font-size: 12px; transition: color .1s, background .1s;
        }
        .pb-block-act-btn:hover { color: #374151; background: #f3f4f6; }
        .pb-block-act-btn.del:hover { color: #dc2626; background: #fef2f2; }
        .pb-block-form {
            padding: 12px; border-top: 1px solid #f1f5f9; display: none;
        }
        .pb-block-item.selected .pb-block-form { display: block; }
        .pb-field { margin-bottom: 10px; }
        .pb-field:last-child { margin-bottom: 0; }
        .pb-field label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pb-field input[type="text"],
        .pb-field input[type="url"],
        .pb-field textarea,
        .pb-field select {
            width: 100%; padding: 8px 10px; border: 1.5px solid #e5e7eb;
            border-radius: 6px; font-size: 13px; font-family: inherit;
            outline: none; transition: border-color .15s; background: #fff; color: #1e293b;
        }
        .pb-field input:focus,
        .pb-field textarea:focus,
        .pb-field select:focus { border-color: #0d5f5f; }
        .pb-field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
        .pb-field-hint { font-size: 11px; color: #94a3b8; margin-top: 3px; line-height: 1.4; }
        .pb-field-row { display: flex; gap: 8px; }
        .pb-field-row .pb-field { flex: 1; }
        .pb-toggle-row { display: flex; align-items: center; gap: 10px; }
        .pb-toggle {
            position: relative; width: 36px; height: 20px; flex-shrink: 0;
        }
        .pb-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
        .pb-toggle-slider {
            position: absolute; inset: 0; background: #cbd5e1;
            border-radius: 10px; transition: background .2s; cursor: pointer;
        }
        .pb-toggle-slider::before {
            content: ''; position: absolute; width: 14px; height: 14px;
            left: 3px; top: 3px; background: #fff; border-radius: 50%;
            transition: transform .2s;
        }
        .pb-toggle input:checked + .pb-toggle-slider { background: #0d5f5f; }
        .pb-toggle input:checked + .pb-toggle-slider::before { transform: translateX(16px); }
        .pb-toggle-label { font-size: 13px; color: #374151; }

        /* Add block toolbar */
        .pb-add-bar {
            padding: 10px 8px; border-top: 1px solid #e5e7eb; background: #f8fafc;
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .pb-add-btn {
            padding: 5px 10px; border: 1.5px solid #e5e7eb; border-radius: 6px;
            font-size: 12px; font-weight: 600; background: #fff; cursor: pointer;
            color: #374151; font-family: inherit; transition: border-color .1s, background .1s;
            display: flex; align-items: center; gap: 5px;
        }
        .pb-add-btn:hover { border-color: #0d5f5f; color: #0d5f5f; background: #f0fdfd; }

        /* ── Right Panel: Preview ─────────────────────── */
        .pb-right {
            flex: 1; display: flex; flex-direction: column; min-height: 0; background: #e5e7eb;
        }
        #pb-preview {
            flex: 1; border: none; background: #fff;
        }

        /* ── Table editor rows ────────────────────────── */
        .tbl-editor { width: 100%; }
        .tbl-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
        .tbl-row input { flex: 1; padding: 6px 8px; border: 1.5px solid #e5e7eb; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; }
        .tbl-row input:focus { border-color: #0d5f5f; }
        .tbl-row-del { background: none; border: none; cursor: pointer; color: #dc2626; font-size: 13px; padding: 4px; }
        .tbl-add-row { font-size: 12px; color: #0d5f5f; cursor: pointer; background: none; border: none; font-family: inherit; font-weight: 600; padding: 2px 0; }
        .tbl-add-row:hover { text-decoration: underline; }

        /* ── FAQ / List row editors ────────────────────── */
        .repeater-row { display: flex; gap: 4px; margin-bottom: 6px; align-items: flex-start; }
        .repeater-row textarea { flex: 1; padding: 6px 8px; border: 1.5px solid #e5e7eb; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; resize: vertical; min-height: 40px; }
        .repeater-row textarea:focus { border-color: #0d5f5f; }
        .repeater-row input { flex: 1; padding: 6px 8px; border: 1.5px solid #e5e7eb; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; }
        .repeater-row input:focus { border-color: #0d5f5f; }

        /* Supporting docs rows */
        .sdoc-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; margin-bottom: 4px; align-items: center; }
        .sdoc-row input { padding: 6px 8px; border: 1.5px solid #e5e7eb; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; }
        .sdoc-row input:focus { border-color: #0d5f5f; }

        /* Version history rows */
        .vh-row { display: grid; grid-template-columns: 90px 1fr auto; gap: 4px; margin-bottom: 4px; align-items: center; }
        .vh-row input { padding: 6px 8px; border: 1.5px solid #e5e7eb; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; }
        .vh-row input:focus { border-color: #0d5f5f; }

        /* ── Copy overlay ─────────────────────────────── */
        #copy-toast {
            position: fixed; bottom: 24px; right: 24px; background: #0d5f5f; color: #fff;
            padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
            opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9000;
        }
        #copy-toast.show { opacity: 1; }

        /* Badge colors per block type */
        .badge-header    { background: #0d5f5f20; color: #0d5f5f; }
        .badge-flag      { background: #fef3c720; color: #92400e; }
        .badge-section   { background: #dbeafe; color: #1d4ed8; }
        .badge-subsection { background: #ede9fe; color: #6d28d9; }
        .badge-subsubsection { background: #fce7f3; color: #9d174d; }
        .badge-paragraph { background: #f1f5f9; color: #475569; }
        .badge-note      { background: #dcfce7; color: #166534; }
        .badge-list      { background: #fef9c3; color: #713f12; }
        .badge-table     { background: #e0f2fe; color: #0369a1; }
        .badge-faq       { background: #fae8ff; color: #7e22ce; }
        .badge-button    { background: #d1fae5; color: #065f46; }
        .badge-image     { background: #fee2e2; color: #991b1b; }
        .badge-supporting-docs { background: #f0fdf4; color: #166534; }
        .badge-version-history { background: #f8fafc; color: #475569; }
    </style>
</head>
<body>

<!-- Password Gate -->
<div id="pb-gate">
    <div class="gate-card">
        <div class="gate-logo">WDT Intranet</div>
        <div class="gate-title">Page Builder</div>
        <div class="gate-sub">Enter the admin password to continue.</div>
        <input class="gate-input" type="password" id="gateInput" placeholder="Password" autocomplete="current-password">
        <button class="gate-btn" id="gateBtn">Unlock</button>
        <div class="gate-error" id="gateError">Incorrect password. Try again.</div>
    </div>
</div>

<!-- Main App -->
<div id="pb-app">
    <!-- Top Bar -->
    <div class="pb-topbar">
        <a href="admin.html"><i class="fas fa-arrow-left"></i> Admin</a>
        <span class="pb-topbar-sep">|</span>
        <div class="pb-topbar-title"><i class="fas fa-file-code" style="opacity:.7;margin-right:6px;"></i>Page Builder</div>
        <div class="pb-topbar-actions">
            <button class="pb-btn pb-btn-outline" id="btnReset"><i class="fas fa-undo"></i> Reset</button>
            <button class="pb-btn pb-btn-primary" id="btnCopy"><i class="fas fa-copy"></i> Copy HTML</button>
        </div>
    </div>

    <!-- Main two-column layout -->
    <div class="pb-main">
        <!-- Left: Block list -->
        <div class="pb-left">
            <div class="pb-panel-header">
                Blocks
                <span id="block-count">0 blocks</span>
            </div>
            <div class="pb-block-list" id="blockList"></div>
            <div class="pb-add-bar" id="addBar"></div>
        </div>

        <!-- Right: Preview -->
        <div class="pb-right">
            <div class="pb-panel-header" style="background:#e5e7eb;border-bottom:1px solid #d1d5db;">
                Live Preview
                <span>Updates as you type</span>
            </div>
            <iframe id="pb-preview" title="Page preview"></iframe>
        </div>
    </div>
</div>

<div id="copy-toast">HTML copied to clipboard!</div>

<script>
'use strict';

// ── State (must be declared before any call to showApp/init) ──
let blocks = [];
let selectedId = null;
let _uid = 0;

// Base URL of the site root (same directory as page-builder.html)
const _siteBase = window.location.href.replace(/\/[^/]*$/, '/');

// ── Auth ─────────────────────────────────────────────────
const ADMIN_PASSWORD = 'intranet8you';
const SESSION_KEY = 'wdt_admin_auth';

function showApp() {
    document.getElementById('pb-gate').style.display = 'none';
    document.getElementById('pb-app').style.display = 'flex';
    init();
}

document.getElementById('gateBtn').addEventListener('click', tryAuth);
document.getElementById('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });

function tryAuth() {
    if (document.getElementById('gateInput').value === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, '1');
        showApp();
    } else {
        document.getElementById('gateError').style.display = 'block';
    }
}

// ── Block definitions ─────────────────────────────────────
const BLOCK_DEFS = {
    'header': {
        label: 'Header',
        preview: b => b.title || '(untitled)',
        fields: [
            { key: 'title',       label: 'Document Title',     type: 'text',   placeholder: 'Your Document Title Here' },
            { key: 'docType',     label: 'Document Type',      type: 'select',
              options: ['Policy','Guideline','Procedure','Standard','Memo','Notice','Report','Guide','Forms and Templates','Job Aids and Guidelines','Resources'] },
            { key: 'lastUpdated', label: 'Last Updated',       type: 'text',   placeholder: 'e.g. May 5, 2026' },
            { key: 'department',  label: 'Department / Branch',type: 'text',   placeholder: 'e.g. Workforce Development & Training' },
            { key: 'depth',       label: 'File Location',      type: 'select',
              options: ['root', 'subfolder'] },
        ],
    },
    'flag': {
        label: 'Flag Banner',
        preview: b => b.text || '(flag text)',
        fields: [
            { key: 'text',  label: 'Flag Text',  type: 'text', placeholder: 'e.g. PROTECTED B' },
            { key: 'style', label: 'Style', type: 'select',
              options: ['info', 'warning', 'danger', 'success', 'neutral'] },
        ],
    },
    'section': {
        label: 'Section',
        preview: b => b.title || '(section title)',
        fields: [
            { key: 'title', label: 'Section Title', type: 'text', placeholder: 'Section heading' },
        ],
    },
    'subsection': {
        label: 'Subsection',
        preview: b => b.title || '(subsection title)',
        fields: [
            { key: 'title', label: 'Subsection Title', type: 'text', placeholder: 'Subsection heading' },
        ],
    },
    'subsubsection': {
        label: 'Sub-subsection',
        preview: b => b.title || '(sub-subsection title)',
        fields: [
            { key: 'title', label: 'Sub-subsection Title', type: 'text', placeholder: 'Sub-subsection heading' },
        ],
    },
    'paragraph': {
        label: 'Paragraph',
        preview: b => (b.text || '(paragraph text)').slice(0, 60),
        fields: [
            { key: 'text', label: 'Text', type: 'textarea', placeholder: 'Paragraph content. Supports **bold**, [link text](url), [link](url){new}' },
        ],
    },
    'note': {
        label: 'Note',
        preview: b => b.text ? b.text.slice(0, 50) : '(note text)',
        fields: [
            { key: 'style', label: 'Style', type: 'select',
              options: ['info', 'warning', 'tip', 'important'] },
            { key: 'text', label: 'Text', type: 'textarea', placeholder: 'Note content. Supports **bold**, [link](url)' },
        ],
    },
    'list': {
        label: 'List',
        preview: b => b.listType === 'ordered' ? 'Ordered list' : 'Bullet list',
        fields: [
            { key: 'listType', label: 'Type', type: 'select', options: ['unordered', 'ordered'] },
            { key: '_items', label: 'Items', type: 'repeater-text', placeholder: 'List item' },
        ],
    },
    'table': {
        label: 'Table',
        preview: b => {
            const cols = (b._headers || []).filter(Boolean);
            return cols.length ? `${cols.length} columns` : 'Table';
        },
        fields: [
            { key: '_table', label: 'Table Data', type: 'table-editor' },
        ],
    },
    'faq': {
        label: 'FAQ',
        preview: b => {
            const qs = b._faqs || [];
            return qs.length ? `${qs.length} Q&A${qs.length > 1 ? 's' : ''}` : 'FAQ';
        },
        fields: [
            { key: '_faqs', label: 'Questions & Answers', type: 'faq-editor' },
        ],
    },
    'button': {
        label: 'Button',
        preview: b => b.label || '(button label)',
        fields: [
            { key: 'label', label: 'Button Label', type: 'text', placeholder: 'Click here' },
            { key: 'href',  label: 'URL',           type: 'url',  placeholder: 'https://...' },
            { key: 'newTab', label: 'Open in new tab', type: 'toggle' },
        ],
    },
    'image': {
        label: 'Image',
        preview: b => b.src || '(image path)',
        fields: [
            { key: 'src', label: 'Image Path / URL', type: 'text', placeholder: 'images/photo.png or https://...' },
            { key: 'alt', label: 'Alt Text',         type: 'text', placeholder: 'Describe the image' },
            { key: 'caption', label: 'Caption',      type: 'text', placeholder: 'Optional caption' },
            { key: 'width',   label: 'Max Width',    type: 'text', placeholder: 'e.g. 600px or 80%' },
        ],
    },
    'supporting-docs': {
        label: 'Supporting Docs',
        preview: b => {
            const docs = b._docs || [];
            return docs.length ? `${docs.length} document${docs.length > 1 ? 's' : ''}` : 'Supporting Documents';
        },
        fields: [
            { key: 'title', label: 'Section Title', type: 'text', placeholder: 'Supporting Documents' },
            { key: '_docs', label: 'Documents (Label → URL)', type: 'sdocs-editor' },
        ],
    },
    'version-history': {
        label: 'Version History',
        preview: b => {
            const rows = b._versions || [];
            return rows.length ? `${rows.length} entr${rows.length > 1 ? 'ies' : 'y'}` : 'Version History';
        },
        fields: [
            { key: '_versions', label: 'Version Entries', type: 'vh-editor' },
        ],
    },
};

function uid() { return ++_uid; }

function defaultBlock(type) {
    const b = { _id: uid(), _type: type };
    if (type === 'header') {
        b.title = ''; b.docType = 'Policy'; b.lastUpdated = ''; b.department = 'Workforce Development & Training'; b.depth = 'root';
    } else if (type === 'flag') {
        b.text = ''; b.style = 'info';
    } else if (type === 'section' || type === 'subsection' || type === 'subsubsection') {
        b.title = '';
    } else if (type === 'paragraph') {
        b.text = '';
    } else if (type === 'note') {
        b.style = 'info'; b.text = '';
    } else if (type === 'list') {
        b.listType = 'unordered'; b._items = [''];
    } else if (type === 'table') {
        b._headers = ['Column 1', 'Column 2', 'Column 3'];
        b._rows = [['', '', '']];
    } else if (type === 'faq') {
        b._faqs = [{ q: '', a: '' }];
    } else if (type === 'button') {
        b.label = ''; b.href = ''; b.newTab = false;
    } else if (type === 'image') {
        b.src = ''; b.alt = ''; b.caption = ''; b.width = '';
    } else if (type === 'supporting-docs') {
        b.title = 'Supporting Documents'; b._docs = [{ label: '', url: '' }];
    } else if (type === 'version-history') {
        b._versions = [{ ver: '', date: '', author: '', desc: '' }];
    }
    return b;
}

// ── Init ──────────────────────────────────────────────────
function init() {
    renderAddBar();
    // Default initial blocks
    const hb = defaultBlock('header');
    hb.title = 'Document Title';
    hb.docType = 'Policy';
    hb.department = 'Workforce Development & Training';
    blocks.push(hb);
    const sb = defaultBlock('section');
    sb.title = 'Description';
    blocks.push(sb);
    const pb = defaultBlock('paragraph');
    pb.text = 'Enter your content here.';
    blocks.push(pb);

    renderAll();
    document.getElementById('btnCopy').addEventListener('click', copyHTML);
    document.getElementById('btnReset').addEventListener('click', () => {
        if (!confirm('Reset all blocks? This cannot be undone.')) return;
        blocks = [];
        selectedId = null;
        blocks.push(Object.assign(defaultBlock('header'), { title: 'Page Title' }));
        blocks.push(Object.assign(defaultBlock('section'), { title: 'Description' }));
        blocks.push(Object.assign(defaultBlock('paragraph'), { text: 'Enter your content here.' }));
        renderAll();
    });
}

// ── Render block list ─────────────────────────────────────
function renderAll() {
    const list = document.getElementById('blockList');
    list.innerHTML = '';
    blocks.forEach((b, idx) => {
        list.appendChild(buildBlockItem(b, idx));
    });
    document.getElementById('block-count').textContent = blocks.length + ' block' + (blocks.length !== 1 ? 's' : '');
    refreshPreview();
}

function buildBlockItem(b, idx) {
    const def = BLOCK_DEFS[b._type];
    const wrap = document.createElement('div');
    wrap.className = 'pb-block-item' + (b._id === selectedId ? ' selected' : '');
    wrap.dataset.id = b._id;

    const header = document.createElement('div');
    header.className = 'pb-block-header';
    header.innerHTML = `
        <span class="pb-block-type-badge badge-${b._type}">${def.label}</span>
        <span class="pb-block-preview">${escHtml(def.preview(b))}</span>
        <div class="pb-block-actions">
            ${idx > 0 ? `<button class="pb-block-act-btn" title="Move up" data-act="up"><i class="fas fa-chevron-up"></i></button>` : ''}
            ${idx < blocks.length - 1 ? `<button class="pb-block-act-btn" title="Move down" data-act="down"><i class="fas fa-chevron-down"></i></button>` : ''}
            <button class="pb-block-act-btn dup" title="Duplicate" data-act="dup"><i class="fas fa-copy"></i></button>
            <button class="pb-block-act-btn del" title="Delete" data-act="del"><i class="fas fa-trash"></i></button>
        </div>
    `;

    header.addEventListener('click', e => {
        const act = e.target.closest('[data-act]');
        if (act) {
            handleAct(b._id, act.dataset.act);
            return;
        }
        selectedId = (selectedId === b._id) ? null : b._id;
        renderAll();
    });

    const form = document.createElement('div');
    form.className = 'pb-block-form';
    buildForm(b, form);

    wrap.appendChild(header);
    wrap.appendChild(form);
    return wrap;
}

function handleAct(id, act) {
    const idx = blocks.findIndex(b => b._id === id);
    if (idx === -1) return;
    if (act === 'up' && idx > 0) {
        [blocks[idx - 1], blocks[idx]] = [blocks[idx], blocks[idx - 1]];
    } else if (act === 'down' && idx < blocks.length - 1) {
        [blocks[idx], blocks[idx + 1]] = [blocks[idx + 1], blocks[idx]];
    } else if (act === 'dup') {
        const copy = JSON.parse(JSON.stringify(blocks[idx]));
        copy._id = uid();
        blocks.splice(idx + 1, 0, copy);
        selectedId = copy._id;
    } else if (act === 'del') {
        blocks.splice(idx, 1);
        if (selectedId === id) selectedId = null;
    }
    renderAll();
}

// ── Form builder ─────────────────────────────────────────
function buildForm(b, container) {
    const def = BLOCK_DEFS[b._type];
    def.fields.forEach(f => {
        const wrap = document.createElement('div');
        wrap.className = 'pb-field';
        const lbl = document.createElement('label');
        lbl.textContent = f.label;
        wrap.appendChild(lbl);

        if (f.type === 'text' || f.type === 'url') {
            const inp = document.createElement('input');
            inp.type = f.type === 'url' ? 'url' : 'text';
            inp.value = b[f.key] || '';
            inp.placeholder = f.placeholder || '';
            inp.addEventListener('input', () => { b[f.key] = inp.value; refreshPreview(); updatePreview(b); });
            wrap.appendChild(inp);
        } else if (f.type === 'textarea') {
            const ta = document.createElement('textarea');
            ta.value = b[f.key] || '';
            ta.placeholder = f.placeholder || '';
            ta.rows = 4;
            ta.addEventListener('input', () => { b[f.key] = ta.value; refreshPreview(); updatePreview(b); });
            wrap.appendChild(ta);
            const hint = document.createElement('div');
            hint.className = 'pb-field-hint';
            hint.textContent = 'Markup: **bold**, [text](url), [text](url){new}';
            wrap.appendChild(hint);
        } else if (f.type === 'select') {
            const sel = document.createElement('select');
            (f.options || []).forEach(opt => {
                const o = document.createElement('option');
                o.value = opt; o.textContent = opt || '— none —';
                if (b[f.key] === opt) o.selected = true;
                sel.appendChild(o);
            });
            sel.addEventListener('change', () => { b[f.key] = sel.value; refreshPreview(); updatePreview(b); });
            wrap.appendChild(sel);
        } else if (f.type === 'toggle') {
            const row = document.createElement('div');
            row.className = 'pb-toggle-row';
            const tog = document.createElement('label');
            tog.className = 'pb-toggle';
            const inp = document.createElement('input');
            inp.type = 'checkbox';
            inp.checked = !!b[f.key];
            const slider = document.createElement('span');
            slider.className = 'pb-toggle-slider';
            tog.appendChild(inp);
            tog.appendChild(slider);
            const togLbl = document.createElement('span');
            togLbl.className = 'pb-toggle-label';
            togLbl.textContent = f.placeholder || f.label;
            inp.addEventListener('change', () => { b[f.key] = inp.checked; refreshPreview(); });
            row.appendChild(tog);
            row.appendChild(togLbl);
            wrap.appendChild(row);
        } else if (f.type === 'repeater-text') {
            wrap.appendChild(buildRepeaterText(b));
        } else if (f.type === 'table-editor') {
            wrap.appendChild(buildTableEditor(b));
        } else if (f.type === 'faq-editor') {
            wrap.appendChild(buildFaqEditor(b));
        } else if (f.type === 'sdocs-editor') {
            wrap.appendChild(buildSdocsEditor(b));
        } else if (f.type === 'vh-editor') {
            wrap.appendChild(buildVhEditor(b));
        }

        container.appendChild(wrap);
    });
}

function updatePreview(b) {
    // Update the preview text in the block header without full re-render
    const def = BLOCK_DEFS[b._type];
    const item = document.querySelector(`.pb-block-item[data-id="${b._id}"] .pb-block-preview`);
    if (item) item.textContent = def.preview(b);
}

// ── Repeater: plain text items ────────────────────────────
function buildRepeaterText(b) {
    if (!b._items) b._items = [''];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';
        b._items.forEach((item, i) => {
            const row = document.createElement('div');
            row.className = 'repeater-row';
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.value = item;
            inp.placeholder = 'List item';
            inp.addEventListener('input', () => { b._items[i] = inp.value; refreshPreview(); });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._items.splice(i, 1); if (!b._items.length) b._items.push(''); render(); refreshPreview(); });
            row.appendChild(inp);
            row.appendChild(del);
            wrap.appendChild(row);
        });
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'tbl-add-row';
        add.textContent = '+ Add item';
        add.addEventListener('click', () => { b._items.push(''); render(); refreshPreview(); });
        wrap.appendChild(add);
    }
    render();
    return wrap;
}

// ── Table editor ──────────────────────────────────────────
function buildTableEditor(b) {
    if (!b._headers) b._headers = ['Column 1', 'Column 2', 'Column 3'];
    if (!b._rows) b._rows = [['', '', '']];
    const wrap = document.createElement('div');

    function render() {
        wrap.innerHTML = '';

        // Header row
        const hdrLbl = document.createElement('div');
        hdrLbl.style.cssText = 'font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;';
        hdrLbl.textContent = 'Column Headers';
        wrap.appendChild(hdrLbl);

        const hdrRow = document.createElement('div');
        hdrRow.className = 'tbl-row';
        b._headers.forEach((h, ci) => {
            const inp = document.createElement('input');
            inp.value = h;
            inp.placeholder = 'Header ' + (ci + 1);
            inp.addEventListener('input', () => { b._headers[ci] = inp.value; refreshPreview(); });
            hdrRow.appendChild(inp);
        });
        const addCol = document.createElement('button');
        addCol.type = 'button';
        addCol.className = 'tbl-row-del';
        addCol.innerHTML = '<i class="fas fa-plus"></i>';
        addCol.title = 'Add column';
        addCol.style.color = '#0d5f5f';
        addCol.addEventListener('click', () => {
            b._headers.push('Column ' + (b._headers.length + 1));
            b._rows.forEach(r => r.push(''));
            render(); refreshPreview();
        });
        hdrRow.appendChild(addCol);
        wrap.appendChild(hdrRow);

        // Data rows
        const rowsLbl = document.createElement('div');
        rowsLbl.style.cssText = 'font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;';
        rowsLbl.textContent = 'Rows';
        wrap.appendChild(rowsLbl);

        b._rows.forEach((row, ri) => {
            const rowEl = document.createElement('div');
            rowEl.className = 'tbl-row';
            b._headers.forEach((_, ci) => {
                const inp = document.createElement('input');
                inp.value = row[ci] || '';
                inp.placeholder = 'Cell';
                inp.addEventListener('input', () => { b._rows[ri][ci] = inp.value; refreshPreview(); });
                rowEl.appendChild(inp);
            });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._rows.splice(ri, 1); render(); refreshPreview(); });
            rowEl.appendChild(del);
            wrap.appendChild(rowEl);
        });

        const addRow = document.createElement('button');
        addRow.type = 'button';
        addRow.className = 'tbl-add-row';
        addRow.textContent = '+ Add row';
        addRow.addEventListener('click', () => {
            b._rows.push(b._headers.map(() => ''));
            render(); refreshPreview();
        });
        wrap.appendChild(addRow);
    }
    render();
    return wrap;
}

// ── FAQ editor ────────────────────────────────────────────
function buildFaqEditor(b) {

        wrap.innerHTML = '';

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'tbl-row-del';
            del.innerHTML = '<i class="fas fa-times"></i>';
            del.addEventListener('click', () => { b._faqs.splice(i, 1); if (!b._faqs.length) b._faqs.push({q:'',a:''}); render(); refreshPreview(); });
            qrow.appendChild(qinp);
            qrow.appendChild(del);

            const arow = document.createElement('div');

// ── Add bar ───────────────────────────────────────────────
function renderAddBar() {
    const bar = document.getElementById('addBar');

    Object.entries(BLOCK_DEFS).forEach(([type, def]) => {
        const btn = document.createElement('button');
        btn.className = 'pb-add-btn';
        btn.innerHTML = `<i class="fas fa-plus" style="font-size:10px;"></i> ${def.label}`;
        btn.addEventListener('click', () => {
            const b = defaultBlock(type);
            blocks.push(b);

            setTimeout(() => {
                const el = document.querySelector(`.pb-block-item[data-id="${b._id}"]`);

}

// ── Inline markup parser ──────────────────────────────────
function parseInline(text) {
    if (!text) return '';
    // Escape HTML first
    let s = escHtml(text);
    // **bold**
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // [text](url){new} — new tab
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)\{new\}/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return s;
}

// ── HTML generator ────────────────────────────────────────

function generateHTML(forPreview) {

    );

    const verHistBlock = blocks.find(b => b._type === 'version-history');

    const verHistHtml = verHistBlock ? buildVerHistHtml(verHistBlock) : '';

        ? `    <link rel="stylesheet" href="${_siteBase}html-document-styles.css">`

        : `    <script src="${cssBase}html-document-script.js"><\/script>`;

    return `<!DOCTYPE html>

    <title>${escHtml(title)}</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
${cssTag}
</head>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
    <button id="scrollToTopBtn" title="Back to top"><i class="fas fa-chevron-up"></i></button>

    <div class="policy-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">${escHtml(title)}</div>
                <div class="sidebar-subtitle">Navigation</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
        </aside>

        <main class="main-content">
            <header class="document-header">
                <h1 class="document-title">${escHtml(title)}</h1>
                <div class="document-meta">
                    <div class="meta-item">
                        <i class="fas fa-file-alt"></i>
                        <span class="meta-label">Document Type:</span>
                        <span>${escHtml(docType)}</span>
                    </div>${lastUpdated ? `
                    <div class="meta-item">
                        <i class="fas fa-calendar"></i>
                        <span class="meta-label">Last Updated:</span>

                    </div>` : ''}${department ? `
                    <div class="meta-item">

${bodyHtml}
            </article>
${supDocsHtml}${verHistHtml}
        </main>

${jsTag}

}

function buildBodyHtml(contentBlocks) {
    let html = '';
    let sectionOpen = false;
    let subsectionOpen = false;
    const i0 = '                ';    // 16 sp — inside article
    const i1 = '                    '; // 20 sp — inside section
    const i2 = '                        '; // 24 sp — inside subsection div

    contentBlocks.forEach(b => {
        if (b._type === 'section') {
            if (subsectionOpen) { html += i1 + '</div>\n'; subsectionOpen = false; }
            if (sectionOpen)    { html += i0 + '</section>\n\n'; }
            html += `${i0}<section class="section" id="${escHtml(b.title || 'section')}">\n`;
            html += `${i1}<h2 class="section-title">${escHtml(b.title || '')}</h2>\n`;
            sectionOpen = true;
        } else if (b._type === 'subsection') {
            if (subsectionOpen) { html += i1 + '</div>\n'; }
            html += `${i1}<div id="${escHtml(b.title || 'subsection')}">\n`;
            html += `${i2}<h3 class="subsection-title">${escHtml(b.title || '')}</h3>\n`;
            subsectionOpen = true;
        } else if (b._type === 'subsubsection') {
            const ind = subsectionOpen ? i2 : i1;
            html += `${ind}<h4 class="sub-subsection-title" id="${escHtml(b.title || 'sub')}">${escHtml(b.title || '')}</h4>\n`;
        } else {
            const ind = subsectionOpen ? i2 : (sectionOpen ? i1 : i0);
            html += renderBlockHtml(b, ind);
        }
    });

    if (subsectionOpen) html += i1 + '</div>\n';
    if (sectionOpen)    html += i0 + '</section>\n';
    return html;
}

function renderBlockHtml(b, ind) {
    switch (b._type) {
        case 'flag':
            return `${ind}<div class="document-flag">\n${ind}    <strong>${escHtml(b.text || '')}</strong>\n${ind}</div>\n`;
        case 'paragraph':
            return `${ind}<p>${parseInline(b.text || '')}</p>\n`;
        case 'note':
            return `${ind}<div class="note">\n${ind}    <p>${parseInline(b.text || '')}</p>\n${ind}</div>\n`;
        case 'list': {
            const tag = b.listType === 'ordered' ? 'ol' : 'ul';
            const items = (b._items || []).filter(i => i.trim()).map(i => `${ind}    <li>${parseInline(i)}</li>`).join('\n');
            return items ? `${ind}<${tag}>\n${items}\n${ind}</${tag}>\n` : '';
        }
        case 'table': {
            const hdrs = (b._headers || []).map(h => `<th>${escHtml(h)}</th>`).join('');
            const rows = (b._rows || []).map(r => {
                const cells = (b._headers || []).map((_, ci) => `<td>${parseInline(r[ci] || '')}</td>`).join('');
                return `${ind}        <tr>${cells}</tr>`;
            }).join('\n');
            return `${ind}<table class="data-table">\n${ind}    <thead><tr>${hdrs}</tr></thead>\n${ind}    <tbody>\n${rows}\n${ind}    </tbody>\n${ind}</table>\n`;
        }
        case 'faq': {
            const items = (b._faqs || []).filter(f => f.q || f.a).map(f =>
                `${ind}<details class="faq-item">\n${ind}    <summary class="faq-question">${escHtml(f.q || '')}</summary>\n${ind}    <div class="faq-answer"><p>${parseInline(f.a || '')}</p></div>\n${ind}</details>`
            ).join('\n');
            return items ? items + '\n' : '';
        }
        case 'button': {
            const target = b.newTab ? ' target="_blank" rel="noopener noreferrer"' : '';
            return `${ind}<div class="doc-btn-group">\n${ind}    <a href="${escHtml(b.href || '#')}" class="doc-btn doc-btn-primary"${target}>${escHtml(b.label || 'Click here')}</a>\n${ind}</div>\n`;
        }
        case 'image': {
            const caption = b.caption ? `\n${ind}<p style="font-size:13px;color:#64748b;text-align:center;margin-top:6px;">${escHtml(b.caption)}</p>` : '';
            return `${ind}<img src="${escHtml(b.src || '')}" alt="${escHtml(b.alt || '')}" class="document-image">${caption}\n`;
        }
        default: return '';
    }
}

function buildSupDocsHtml(b) {
    const docs = (b._docs || []).filter(d => d.label || d.url);
    if (!docs.length) return '';
    const links = docs.map(d =>
        `                <a href="${escHtml(d.url || '#')}" class="document-link">\n                    <i class="fas fa-file-alt"></i>\n                    <span>${escHtml(d.label || d.url)}</span>\n                </a>`
    ).join('\n');
    return `            <section class="linked-documents" id="Support Documents">
                <h2 class="section-heading"><i class="fas fa-link"></i> Supporting Documents</h2>
                <div class="document-links">
${links}
                </div>
            </section>\n`;
}

function buildVerHistHtml(b) {
    const rows = (b._versions || []).filter(v => v.date || v.desc || v.ver);
    if (!rows.length) return '';
    const trs = rows.map(v =>
        `                    <tr>\n                        <td><span class="version-number">${escHtml(v.ver||'')}</span></td>\n                        <td>${escHtml(v.date||'')}</td>\n                        <td>${escHtml(v.author||'')}</td>\n                        <td>${escHtml(v.desc||'')}</td>\n                    </tr>`
    ).join('\n');
    return `            <section class="version-history" id="Version History">
                <h2 class="section-heading"><i class="fas fa-history"></i> Version History</h2>
                <table class="version-table">
                    <thead><tr><th>Version</th><th>Date</th><th>Updated By</th><th>Changes</th></tr></thead>
                    <tbody>
${trs}
                    </tbody>
                </table>
            </section>\n`;
}

// ── Preview ───────────────────────────────────────────────
function refreshPreview() {
    const iframe = document.getElementById('pb-preview');
    const html = generateHTML(true);
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    iframe.src = url;
}

// ── Copy HTML ─────────────────────────────────────────────
function copyHTML() {
    const html = generateHTML(false);
    navigator.clipboard.writeText(html).then(() => {
        const toast = document.getElementById('copy-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
    });
}

// ── Helpers ───────────────────────────────────────────────
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ── Boot (after all declarations) ────────────────────────
if (sessionStorage.getItem(SESSION_KEY) === '1') showApp();
</script>
</body>
